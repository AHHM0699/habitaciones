<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Habitaciones y Cobros</title>
<meta name="theme-color" content="#0E5A50">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habitaciones">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Familjen+Grotesk:wght@500;600;700&family=Martian+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Bloqueo del dispositivo: se pide una sola vez por celular o computadora -->
<section id="lock" class="login" hidden>
  <form class="panel" id="lock-form" autocomplete="off">
    <div class="brand"><span class="minitag">01</span><div><h1>Habitaciones y Cobros</h1><div class="who">Acceso restringido</div></div></div>
    <div class="field"><label for="k-pin">Código de acceso</label><input id="k-pin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••••"></div>
    <p class="err" id="k-err" role="alert"></p>
    <button class="btn primary">Desbloquear</button>
  </form>
</section>

<!-- Acceso con usuario y PIN -->
<section id="login" class="login" hidden>
  <form class="panel" id="login-form" autocomplete="on">
    <div class="brand"><span class="minitag">01</span><div><h1>Habitaciones y Cobros</h1><div class="who">Entra con tu usuario y tu PIN</div></div></div>
    <div class="field" id="l-user-box"><label for="l-user">Usuario</label><input id="l-user" autocapitalize="none" autocomplete="username" spellcheck="false" placeholder="ej. mama"></div>
    <div class="field" id="l-known" hidden><label>Usuario</label><div class="row" style="align-items:center"><b id="l-known-name" style="flex:1"></b><button type="button" class="linkbtn" id="l-change">Cambiar</button></div></div>
    <div class="field"><label for="l-pin">PIN</label><input id="l-pin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="current-password" placeholder="••••"></div>
    <p class="err" id="l-err" role="alert"></p>
    <button class="btn primary" id="l-btn">Entrar</button>
  </form>
</section>

<!-- App -->
<div id="app" hidden>
  <div class="wrap">
    <header class="top">
      <div class="t"><h1 id="h-title">Habitaciones y Cobros</h1><p id="h-sub">Cargando datos…</p></div>
      <button class="iconbtn" data-act="view" data-view="ajustes" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </header>
    <main id="view"></main>
  </div>
  <nav class="nav" aria-label="Secciones"><div class="in">
    <button data-act="view" data-view="inicio"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
    <button data-act="view" data-view="cuartos"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14 9l2 2"/></svg>Cuartos</button>
    <button data-act="view" data-view="calendario"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendario</button>
    <button data-act="view" data-view="pagos"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 10v5M18 10v5"/></svg>Pagos</button>
    <button data-act="view" data-view="inquilinos"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.8c2 .7 3.2 2.5 3.5 5.2"/></svg>Inquilinos</button>
  </div></nav>
</div>

<div id="sheet-root"></div>
<div id="tip" class="tip" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
